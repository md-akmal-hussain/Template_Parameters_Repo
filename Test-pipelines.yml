name: Variable_Varable_Group_Parameters_Template_Pipeline $(Date:yyyyMMdd)-$(Rev:r)

pool: Yaml_Pool

trigger: none


pr: none

stages:
  - stage: terraformInitValidate
    displayName: Terraform Init Validate
    jobs:
      - job: terraformInit
        displayName: Terraform Init Job
        steps:
        - task: TerraformTask@5
          displayName: Terraform Init Task
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'Yaml_Svc'
            backendAzureRmResourceGroupName: 'pipelinestg'
            backendAzureRmStorageAccountName: 'stgnagpipeline'
            backendAzureRmContainerName: 'production-container'
            backendAzureRmKey: 'akmal'

        - task: TerraformTask@5
          displayName: Terraform Validate Task
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

      
        
  

